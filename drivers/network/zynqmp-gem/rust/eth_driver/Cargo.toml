[package]
name = "eth_driver_zynqmp"
version = "0.1.0"
authors = ["Robbie VanVossen <robert.vanvossen@dornerworks.com>"]
edition = "2021"
license = "BSD-2-Clause"

[dependencies]
log = "0.4.17"
eth-driver-core = { path = "core" }
sel4-driver-interfaces = { git = "https://github.com/seL4/rust-sel4", tag = "v3.0.0" }
sel4-shared-memory = { git = "https://github.com/seL4/rust-sel4", tag = "v3.0.0" }
sel4-logging = { git = "https://github.com/seL4/rust-sel4", tag = "v3.0.0" }
sel4-microkit = { git = "https://github.com/seL4/rust-sel4", tag = "v3.0.0", default-features = false }
sel4-sddf-netqueue = { git = "https://github.com/dornerworks/sel4-sddf-netqueue", branch = "dev-tyler" }
ptr_meta = { version = "0.3.1", default-features = false }
